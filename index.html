<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Cyber Automation Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: orange; text-align: center; font-size: 20px; }
        button, .btn { background: #fc8019; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; text-align: center; display: block; text-decoration: none;}
        button:hover { background: #e06d12; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .account-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px; border-radius: 5px; margin-top: 8px; }
        #order-screen-section { display: none; }
        iframe { width: 100%; height: 350px; border: 2px solid #fc8019; border-radius: 8px; background: #fff; }
        .flex-btns { display: flex; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🍔 Swiggy Cyber Automation Panel</h2>

    <!-- Section 1: Account List & Switching -->
    <div class="card" id="account-section">
        <h3>📱 Linked Accounts</h3>
        <div id="accounts-list">
            <p>Loading accounts...</p>
        </div>
        <button onclick="toggleJsonBox()" style="background: #333; margin-top: 15px;">LOGIN JSON</button>
        
        <!-- LOGIN JSON Portal Box -->
        <div id="json-box" style="display:none; margin-top: 10px;">
            <textarea id="json-input" placeholder="Paste your LOGIN JSON here..." rows="4"></textarea>
            <button onclick="submitJsonLogin()">Save & Login JSON</button>
        </div>
    </div>

    <!-- Section 2: Live Mirror Screen & Order Panel -->
    <div class="card" id="order-screen-section">
        <button onclick="goBack()" style="background: #444; width: auto; padding: 5px 10px; margin-bottom: 10px;">⬅ Back</button>
        <h3>⚡ Live Official Swiggy Mirror</h3>
        <iframe id="live-mirror-frame" src="https://www.swiggy.com/"></iframe>
        
        <div class="flex-btns">
            <button onclick="refreshMirror()" style="background: #555;">🔄 Refresh</button>
            <button onclick="placeOrder()">🚀 Place Order (₹5)</button>
        </div>
    </div>
</div>

<script>
    // Simulated / API connection for frontend
    function loadAccounts() {
        // यहाँ बोट/डेटाबेस से अकाउंट्स फैच होंगे
        document.getElementById('accounts-list').innerHTML = `
            <div class="account-row">
                <span>Acc_7890 (Active)</span>
                <button style="width: auto; padding: 5px 10px;" onclick="selectAccount('Acc_7890')">Switch</button>
            </div>
        `;
    }

    function toggleJsonBox() {
        const box = document.getElementById('json-box');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function submitJsonLogin() {
        const val = document.getElementById('json-input').value;
        if(!val) { alert("Please enter JSON"); return; }
        alert("LOGIN JSON Saved & Synced with Bot!");
        toggleJsonBox();
        loadAccounts();
    }

    function selectAccount(accName) {
        alert("Switched to " + accName + "! Connecting browser session...");
        document.getElementById('account-section').style.display = 'none';
        document.getElementById('order-screen-section').style.display = 'block';
    }

    function goBack() {
        document.getElementById('order-screen-section').style.display = 'none';
        document.getElementById('account-section').style.display = 'block';
    }

    function refreshMirror() {
        const iframe = document.getElementById('live-mirror-frame');
        iframe.src = iframe.src; // Reloads official iframe view
        alert("Backend page refreshed securely!");
    }

    function placeOrder() {
        if(confirm("Do you want to check wallet balance and place order for ₹5?")) {
            alert("Order execution request sent to backend bot!");
        }
    }

    window.onload = loadAccounts;
</script>

</body>
</html>
