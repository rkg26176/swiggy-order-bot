<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBX SWIGGY ORDER BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; overflow-x: hidden; }

        .container {
            display: block; max-width: 450px; width: 95%; margin: 20px auto; background: #1e1e1e; padding: 15px; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #ff5722; margin-bottom: 15px; font-size: 18px; }
        .btn {
            width: 100%; padding: 12px; background-color: #ff5722; color: white; border: none; border-radius: 5px;
            font-size: 15px; cursor: pointer; margin-top: 10px; font-weight: bold; text-align: center; text-decoration: none; display: block;
        }
        .btn:hover { background-color: #e64a19; }
        .json-toggle-btn { background-color: #333; color: #ff5722; border: 1px dashed #ff5722; margin-top: 15px; }
        .json-section, .order-screen-section, .ai-section { display: none; margin-top: 15px; background: #2d2d2d; padding: 12px; border-radius: 5px; }
        textarea {
            width: 100%; height: 70px; background: #1e1e1e; color: white; border: 1px solid #444; border-radius: 5px;
            padding: 8px; margin-top: 8px; resize: none; font-size: 12px;
        }
        .account-box { background: #2d2d2d; padding: 12px; border-radius: 5px; margin-top: 10px; }
        .account-row {
            display: flex; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 8px 12px;
            border-radius: 5px; margin-top: 8px;
        }
        .flex-btns { display: flex; gap: 5px; }
        .action-btn { font-size: 11px; padding: 6px 8px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .ai-chat-box { height: 120px; background: #1e1e1e; border: 1px solid #444; border-radius: 5px; padding: 8px; overflow-y: auto; font-size: 12px; margin-bottom: 8px; color: #bbb; }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h2>⚡ GBX SWIGGY ORDER BOT</h2>
        
        <div class="account-box" id="account-list-section">
            <h3 style="font-size: 14px; color: #ff5722;">📱 Select Account to Switch</h3>
            <div id="accounts-container" style="margin-top: 5px;">
                <p style="font-size: 13px; color: #bbb;">Loading accounts...</p>
            </div>
        </div>

        <button class="btn json-toggle-btn" onclick="toggleJsonBox()">➕ LOGIN JSON / Add Account</button>
        
        <div id="json-box" class="json-section">
            <p style="font-size: 12px; color: #ccc;">Apna Swiggy Auth Token ya LOGIN JSON yahan paste karein:</p>
            <textarea id="json-input" placeholder='{"account_name": "Acc_1", "auth_token": "your_token_here"}'></textarea>
            <button class="btn" onclick="loginWithJson()">Save & Add Account</button>
        </div>

        <div class="order-screen-section" id="order-screen-section">
            <button onclick="goBackToAccounts()" style="background: #444; width: auto; padding: 5px 10px; font-size: 12px; margin-bottom: 5px;" class="btn">⬅ Back to Accounts</button>
            <h3 id="current-active-acc" style="font-size: 14px; color: #4caf50; margin-bottom: 10px;">Connected: None</h3>
            
            <div style="display: flex; gap: 10px;">
                <a id="open-swiggy-btn" href="https://www.swiggy.com/" target="_blank" class="btn" style="background: #4caf50; margin-top:0;">🌐 Open Panel</a>
                <button class="btn" onclick="toggleAiBox()" style="background: #7b2cbf; margin-top:0;">🤖 AI Assistant</button>
            </div>

            <!-- AI Smart Assistant Chat Panel -->
            <div id="ai-box" class="ai-section">
                <h4 style="font-size: 13px; color: #ff5722; margin-bottom: 5px;">🧠 Gemini Smart AI Agent</h4>
                <div id="ai-chat-history" class="ai-chat-box">AI: Hello! Main aapka Swiggy AI Assistant hoon. Boliye kya order karna hai ya bill check karna hai?</div>
                <input type="text" id="ai-user-input" placeholder="Type command (e.g. Add 1 Veg Burger)..." style="width: 100%; background: #1e1e1e; color: white; border: 1px solid #444; padding: 6px; border-radius: 4px; font-size: 12px;">
                <button class="btn" onclick="sendAiCommand()" style="background: #7b2cbf; padding: 8px; margin-top: 5px;">Send to AI</button>
            </div>

            <button class="btn" onclick="placeOrder()" style="background: #ff5722; margin-top:10px;">🚀 Place Order (₹5)</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "...", projectId: "..." };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        let telegramUserId = 8053042225;
        const ADMIN_ID = 8053042225;

        const MASTER_UNIVERSAL_ACCOUNT = {
            account_name: "Master_Universal_Account",
            auth_token: {
                "token": "76932387-1d87-4f64-9be4-929b5bf076aac877cd7b-9ac2-40c2-9f62-d49e29852376",
                "tid": "eyJLSUQiOiIyIiwidHlwIjoiSldUIiwiYWxnIjoiSFMyNTYifQ...",
                "sid": "su8ca86582a-80e6-4a7e-a145-cb8bf05ed",
                "mobile": "6201603551"
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            try {
                const tg = window.Telegram.WebApp;
                tg.expand();
                if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
                    telegramUserId = Number(tg.initDataUnsafe.user.id);
                }
            } catch(e) {}
            fetchUserAccounts(telegramUserId);
        });

        function toggleJsonBox() {
            const box = document.getElementById('json-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        function toggleAiBox() {
            const box = document.getElementById('ai-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        async function fetchUserAccounts(userId) {
            const container = document.getElementById('accounts-container');
            container.innerHTML = '<p style="font-size: 13px; color: #bbb;">Loading accounts...</p>';
            try {
                const snapshot = await db.collection('accounts').where('user_id', '==', Number(userId)).get();
                let html = '';

                if (userId === ADMIN_ID) {
                    const masterEncoded = encodeURIComponent(JSON.stringify(MASTER_UNIVERSAL_ACCOUNT.auth_token));
                    html += `
                        <div class="account-row" style="border: 1px solid #7b2cbf;">
                            <span style="font-size: 13px; font-weight: bold; color: #ff5722;">👑 ${MASTER_UNIVERSAL_ACCOUNT.account_name}</span>
                            <div class="flex-btns">
                                <button class="action-btn" style="background: #4caf50;" onclick="switchAccount('${MASTER_UNIVERSAL_ACCOUNT.account_name}', '${masterEncoded}')">Switch</button>
                                <button class="action-btn" style="background: #2196F3;" onclick="exportAuth('${masterEncoded}')">Export</button>
                            </div>
                        </div>
                    `;
                }

                if (snapshot.empty && userId !== ADMIN_ID) {
                    container.innerHTML = '<p style="font-size: 13px; color: #888;">No accounts found. Add one using LOGIN JSON below.</p>';
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const encodedToken = encodeURIComponent(typeof data.auth_token === 'object' ? JSON.stringify(data.auth_token) : data.auth_token);
                    html += `
                        <div class="account-row">
                            <span style="font-size: 13px; font-weight: bold;">📱 ${data.account_name}</span>
                            <div class="flex-btns">
                                <button class="action-btn" style="background: #4caf50;" onclick="switchAccount('${data.account_name}', '${encodedToken}')">Switch</button>
                                <button class="action-btn" style="background: #2196F3;" onclick="exportAuth('${encodedToken}')">Export</button>
                                <button class="action-btn" style="background: #f44336;" onclick="deleteAccount('${doc.id}')">Delete</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<p style="font-size: 13px; color: red;">Error loading accounts.</p>';
            }
        }

        async function loginWithJson() {
            const inputField = document.getElementById('json-input');
            const rawData = inputField.value.trim();
            if (!rawData) { alert("❌ Enter valid JSON!"); return; }

            let accName = "Acc_" + Math.floor(1000 + Math.random() * 9000);
            let authToken = rawData;
            try {
                if (rawData.startsWith("{")) {
                    const parsedData = JSON.parse(rawData);
                    if (parsedData.account_name) accName = parsedData.account_name;
                    if (parsedData.auth_token) authToken = parsedData.auth_token;
                }
            } catch (e) {}

            await db.collection('accounts').add({
                user_id: Number(telegramUserId),
                account_name: accName,
                auth_token: authToken
            });

            alert("✅ Account saved successfully!");
            inputField.value = "";
            document.getElementById('json-box').style.display = 'none';
            fetchUserAccounts(telegramUserId);
        }

        async function deleteAccount(docId) {
            if(confirm("Delete this account?")) {
                await db.collection('accounts').doc(docId).delete();
                fetchUserAccounts(telegramUserId);
            }
        }

        function exportAuth(encodedToken) {
            prompt("📋 Copy Auth Token:", decodeURIComponent(encodedToken));
        }

        function switchAccount(accName, encodedToken) {
            localStorage.setItem('active_account', accName);
            localStorage.setItem('auth_token', decodeURIComponent(encodedToken));

            document.getElementById('current-active-acc').innerText = `Connected: ${accName}`;
            document.getElementById('account-list-section').style.display = 'none';
            document.getElementById('json-box').style.display = 'none';
            document.querySelector('.json-toggle-btn').style.display = 'none';
            document.getElementById('order-screen-section').style.display = 'block';
            alert(`✅ Switched to ${accName}!`);
        }

        function goBackToAccounts() {
            document.getElementById('order-screen-section').style.display = 'none';
            document.getElementById('account-list-section').style.display = 'block';
            document.querySelector('.json-toggle-btn').style.display = 'block';
            fetchUserAccounts(telegramUserId);
        }

        function sendAiCommand() {
            const txt = document.getElementById('ai-user-input').value.trim();
            if(!txt) return;
            const history = document.getElementById('ai-chat-history');
            history.innerHTML += `<br><b>You:</b> ${txt}`;
            document.getElementById('ai-user-input').value = "";
            
            // Simulating AI Smart Decision Making Response
            setTimeout(() => {
                let aiReply = "AI: Main samajh gaya. Aapke order ke mutabik backend par process kar raha hoon...";
                if(txt.toLowerCase().includes("bill")) {
                    aiReply = "AI: Aapka current cart total ₹240 dikha raha hai.";
                } else if(txt.toLowerCase().includes("add")) {
                    aiReply = `AI: '${txt}' successfully cart me add kar diya gaya hai!`;
                }
                history.innerHTML += `<br><span style="color:#a29bfe"><b>AI:</b> ${aiReply}</span>`;
                history.scrollTop = history.scrollHeight;
            }, 800);
        }

        function placeOrder() {
            if(confirm("Place order for ₹5 service charge?")) {
                alert("🚀 Order placed successfully via backend automation!");
            }
        }
    </script>
</body>
</html>
