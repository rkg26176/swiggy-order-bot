<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy Order Bot - Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f32;
            --accent-neon: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: #24334d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 25px var(--accent-glow);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-neon);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .status-badge {
            background: rgba(0, 255, 204, 0.1);
            color: var(--accent-neon);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--accent-neon);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
        }

        .card h3 {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .table-container {
            overflow-x: auto;
            margin-top: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            color: var(--text-sub);
            background: rgba(0, 0, 0, 0.2);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .btn {
            background: var(--accent-neon);
            color: #000;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px var(--accent-neon);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Swiggy Order Bot Control</h1>
        <div class="status-badge" id="botStatus">Live Connected</div>
    </header>

    <div class="grid">
        <div class="card">
            <h3>कुल ऑर्डर्स (Total Orders)</h3>
            <div class="value" id="totalOrders">0</div>
        </div>
        <div class="card">
            <h3>एक्टिव सेशंस (Active Sessions)</h3>
            <div class="value" id="activeSessions">0</div>
        </div>
        <div class="card">
            <h3>सिस्टम मोड</h3>
            <div class="value" style="font-size: 1.2rem; color: var(--accent-neon);">Direct Connection</div>
        </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2>रियल-टाइम ऑर्डर्स (Live Data)</h2>
        <button class="btn" onclick="fetchOrders()">डेटा रिफ्रेश करें</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ऑर्डर ID</th>
                    <th>यूजर ID</th>
                    <th>आइटम</th>
                    <th>अमाउंट</th>
                    <th>स्टेटस</th>
                </tr>
            </thead>
            <tbody id="orderTableBody">
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-sub);">कोई फर्जी डेटा नहीं — डेटा लोड हो रहा है...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // बिना किसी फर्जी JSON के सीधे आपके रेलवे बैकएंड से कनेक्टेड
    async function fetchOrders() {
        try {
            const response = await fetch('/api/orders');
            const data = await response.json();
            
            document.getElementById('totalOrders').innerText = data.totalOrders || 0;
            document.getElementById('activeSessions').innerText = data.activeSessions || 0;

            const tbody = document.getElementById('orderTableBody');
            tbody.innerHTML = '';

            if(!data.orders || data.orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-sub);">अभी कोई लाइव ऑर्डर नहीं है।</td></tr>`;
                return;
            }

            data.orders.forEach(order => {
                const row = `<tr>
                    <td>${order.id}</td>
                    <td>${order.userId}</td>
                    <td>${order.items}</td>
                    <td>₹${order.amount}</td>
                    <td><span style="color: var(--accent-neon);">${order.status}</span></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        } catch (err) {
            console.error('डेटा लोड करने में समस्या:', err);
        }
    }

    // पेज खुलते ही असली डेटा लोड करें
    fetchOrders();
</script>

</body>
</html>
