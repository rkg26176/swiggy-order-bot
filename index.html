<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBX SWIGGY ORDER BOT</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Perfect Centered Lock Screen */
        #lock-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .lock-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }
        .lock-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .lock-desc {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 25px;
            max-width: 280px;
            line-height: 1.4;
        }
        .bot-btn {
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
            font-weight: bold;
        }
        
        /* Main App Content Styling */
        .container {
            max-width: 400px;
            width: 90%;
            margin: 30px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ff5722;
            margin-bottom: 15px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #e64a19;
        }
        textarea {
            width: 100%;
            height: 100px;
            background: #2d2d2d;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
            resize: none;
        }
        .account-box {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Lock Screen for Outside Browsers -->
    <div id="lock-screen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">Open in Telegram</div>
        <div class="lock-desc">This app works only inside our GBX SWIGGY ORDER BOT.</div>
        <a href="https://t.me/gbx_swiggy_order_bot" class="bot-btn">Open Telegram Bot ➔</a>
    </div>

    <!-- Main Panel Content -->
    <div class="container" id="main-content">
        <h2>⚡ GBX SWIGGY ORDER BOT</h2>
        
        <div class="account-box">
            <h3>Active Accounts</h3>
            <p id="active-account" style="margin-top: 5px; color: #bbb;">No account selected</p>
        </div>

        <div style="margin-top: 20px;">
            <h3>🔑 Login via JSON</h3>
            <p style="font-size: 12px; color: #aaa; margin-top: 4px;">Apna Swiggy Session JSON yahan paste karein:</p>
            <textarea id="json-input" placeholder='{"account_name": "Acc_1", "auth_token": "your_token_here"}'></textarea>
            <button class="btn" onclick="loginWithJson()">Add & Login Account</button>
        </div>
    </div>

    <script>
        // Check if opened inside Telegram Bot
        window.addEventListener('DOMContentLoaded', (event) => {
            const tg = window.Telegram.WebApp;
            
            // If initData is empty, it means it's opened in an external browser
            if (!tg.initData || tg.initData === "") {
                document.getElementById('lock-screen').style.display = 'flex';
                document.getElementById('main-content').style.display = 'none';
            } else {
                tg.expand();
            }
        });

        function loginWithJson() {
            const rawData = document.getElementById('json-input').value.trim();
            if (!rawData) {
                alert("❌ Kripya valid JSON paste karein!");
                return;
            }

            try {
                const parsedData = JSON.parse(rawData);
                const accName = parsedData.account_name || "Swiggy_User";
                
                localStorage.setItem('active_account', accName);
                localStorage.setItem('auth_token', parsedData.auth_token || rawData);

                document.getElementById('active-account').innerText = `Connected: ${accName}`;
                alert(`✅ Account (${accName}) successfully loaded & connected!`);
                
                document.getElementById('json-input').value = "";
            } catch (error) {
                alert("❌ Invalid JSON format! Kripya sahi JSON data dalein.");
            }
        }

        window.onload = function() {
            const savedAcc = localStorage.getItem('active_account');
            if (savedAcc) {
                document.getElementById('active-account').innerText = `Connected: ${savedAcc}`;
            }
        }
    </script>

</body>
</html>
