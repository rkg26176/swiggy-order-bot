<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBX SWIGGY ORDER BOT</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Lock Screen for External Browsers */
        #lock-screen {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .lock-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }
        .lock-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffffff;
        }
        .lock-desc {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 25px;
            max-width: 280px;
            line-height: 1.4;
        }
        .bot-btn {
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
            font-weight: bold;
        }
        
        /* Main Panel Content */
        .container {
            display: none;
            max-width: 400px;
            width: 90%;
            margin: 30px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #ff5722;
            margin-bottom: 15px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #e64a19;
        }
        .json-toggle-btn {
            background-color: #333;
            color: #ff5722;
            border: 1px dashed #ff5722;
            margin-top: 15px;
        }
        .json-section {
            display: none;
            margin-top: 15px;
            background: #2d2d2d;
            padding: 12px;
            border-radius: 5px;
        }
        textarea {
            width: 100%;
            height: 90px;
            background: #1e1e1e;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 8px;
            margin-top: 8px;
            resize: none;
            font-size: 12px;
        }
        .account-box {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="lock-screen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">Open in Telegram</div>
        <div class="lock-desc">This app works only inside our GBX SWIGGY ORDER BOT.</div>
        <a href="https://t.me/gbx_swiggy_order_bot" class="bot-btn">Open Telegram Bot ➔</a>
    </div>

    <!-- Main Panel Content -->
    <div class="container" id="main-content">
        <h2>⚡ GBX SWIGGY ORDER BOT</h2>
        
        <div class="account-box">
            <h3>Active Accounts</h3>
            <p id="active-account" style="margin-top: 5px; color: #bbb;">No account selected</p>
        </div>

        <button class="btn json-toggle-btn" onclick="toggleJsonBox()">➕ Login JSON / Add Account</button>
        
        <div id="json-box" class="json-section">
            <p style="font-size: 12px; color: #ccc;">Apna Swiggy Auth Token ya JSON yahan paste karein:</p>
            <textarea id="json-input" placeholder='{"account_name": "Acc_1", "auth_token": "your_token_here"}'></textarea>
            <button class="btn" onclick="loginWithJson()">Add Account</button>
        </div>
    </div>

    <script>
        // Firebase Config Setup (Apna Firebase Web Config yahan daal lena agar zaroorat ho, 
        // ya bot ke through automatic sync ke liye Firestore initialize karein)
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID"
        };
        // Initialize Firebase if not already initialized
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let telegramUserId = null;

        // Check Telegram Environment & Get User ID
        window.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            
            if (tg && (tg.initData || tg.platform || window.location.hash.includes('tgWebAppData'))) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                try { 
                    tg.expand(); 
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        telegramUserId = tg.initDataUnsafe.user.id;
                    }
                } catch(e) {}
            } else {
                document.getElementById('lock-screen').style.display = 'flex';
                document.getElementById('main-content').style.display = 'none';
            }
        });

        function toggleJsonBox() {
            const box = document.getElementById('json-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        async function loginWithJson() {
            const rawData = document.getElementById('json-input').value.trim();
            if (!rawData) {
                alert("❌ Kripya valid JSON ya token paste karein!");
                return;
            }

            try {
                let accName = "Acc_" + Math.floor(1000 + Math.random() * 9000);
                let authToken = rawData;

                if (rawData.startsWith("{")) {
                    const parsedData = JSON.parse(rawData);
                    accName = parsedData.account_name || accName;
                    authToken = parsedData.auth_token || rawData;
                }
                
                // Save to Firebase Firestore so Bot can also read it instantly
                if (telegramUserId) {
                    await db.collection('accounts').add({
                        user_id: Number(telegramUserId),
                        account_name: accName,
                        auth_token: authToken
                    });
                }

                localStorage.setItem('active_account', accName);
                localStorage.setItem('auth_token', authToken);

                document.getElementById('active-account').innerText = `Connected: ${accName}`;
                alert(`✅ Account (${accName}) successfully linked & connected to Bot & Mini Web!`);
                
                document.getElementById('json-input').value = "";
                document.getElementById('json-box').style.display = 'none';
            } catch (error) {
                console.error(error);
                alert("❌ Error saving account! Kripya sahi data dalein.");
            }
        }

        window.onload = function() {
            const savedAcc = localStorage.getItem('active_account');
            if (savedAcc) {
                document.getElementById('active-account').innerText = `Connected: ${savedAcc}`;
            }
        }
    </script>

</body>
</html>
