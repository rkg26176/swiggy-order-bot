<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBX SWIGGY ORDER BOT</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Lock Screen for External Browsers */
        #lock-screen {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #121212;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .lock-icon { font-size: 55px; margin-bottom: 15px; }
        .lock-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; color: #ffffff; }
        .lock-desc { font-size: 13px; color: #aaaaaa; margin-bottom: 25px; max-width: 280px; line-height: 1.4; }
        .bot-btn {
            background: linear-gradient(135deg, #7b2cbf, #5a189a);
            color: white; border: none; padding: 12px 24px; border-radius: 25px;
            font-size: 15px; cursor: pointer; text-decoration: none;
            box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4); font-weight: bold;
        }
        
        /* Main Panel Content */
        .container {
            display: none;
            max-width: 450px;
            width: 95%;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; color: #ff5722; margin-bottom: 15px; font-size: 18px; }
        .btn {
            width: 100%; padding: 12px; background-color: #ff5722; color: white;
            border: none; border-radius: 5px; font-size: 15px; cursor: pointer;
            margin-top: 10px; font-weight: bold;
        }
        .btn:hover { background-color: #e64a19; }
        .json-toggle-btn {
            background-color: #333; color: #ff5722; border: 1px dashed #ff5722; margin-top: 15px;
        }
        .json-section, .order-screen-section {
            display: none;
            margin-top: 15px;
            background: #2d2d2d;
            padding: 12px;
            border-radius: 5px;
        }
        textarea {
            width: 100%; height: 80px; background: #1e1e1e; color: white;
            border: 1px solid #444; border-radius: 5px; padding: 8px; margin-top: 8px;
            resize: none; font-size: 12px;
        }
        .account-box {
            background: #2d2d2d; padding: 12px; border-radius: 5px; margin-top: 10px;
        }
        .account-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e1e1e; padding: 8px 12px; border-radius: 5px; margin-top: 8px;
        }
        .switch-btn {
            background: #4caf50; color: white; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .switch-btn:hover { background: #45a049; }
        
        /* Live Mirror Screen Styles */
        iframe {
            width: 100%; height: 350px; border: 2px solid #ff5722; border-radius: 8px; background: #fff; margin-top: 10px;
        }
        .flex-btns { display: flex; gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="lock-screen">
        <div class="lock-icon">🔒</div>
        <div class="lock-title">Open in Telegram</div>
        <div class="lock-desc">This app works only inside our GBX SWIGGY ORDER BOT.</div>
        <a href="https://t.me/gbx_swiggy_order_bot" class="bot-btn">Open Telegram Bot ➔</a>
    </div>

    <!-- Main Panel Content -->
    <div class="container" id="main-content">
        <h2>⚡ GBX SWIGGY ORDER BOT</h2>
        
        <!-- Section 1: Account List & Switcher -->
        <div class="account-box" id="account-list-section">
            <h3 style="font-size: 14px; color: #ff5722;">📱 Select Account to Switch</h3>
            <div id="accounts-container" style="margin-top: 5px;">
                <p style="font-size: 13px; color: #bbb;">Loading accounts from database...</p>
            </div>
        </div>

        <button class="btn json-toggle-btn" onclick="toggleJsonBox()">➕ LOGIN JSON / Add Account</button>
        
        <div id="json-box" class="json-section">
            <p style="font-size: 12px; color: #ccc;">Apna Swiggy Auth Token ya LOGIN JSON yahan paste karein:</p>
            <textarea id="json-input" placeholder='{"account_name": "Acc_1", "auth_token": "your_token_here"}'></textarea>
            <button class="btn" onclick="loginWithJson()">Save & Add Account</button>
        </div>

        <!-- Section 2: Live Official Swiggy Mirror Screen -->
        <div class="order-screen-section" id="order-screen-section">
            <button onclick="goBackToAccounts()" style="background: #444; width: auto; padding: 5px 10px; font-size: 12px; margin-bottom: 5px;" class="btn">⬅ Back to Accounts</button>
            <h3 id="current-active-acc" style="font-size: 14px; color: #4caf50; margin-bottom: 5px;">Connected: None</h3>
            
            <iframe id="live-mirror-frame" src="https://www.swiggy.com/"></iframe>
            
            <div class="flex-btns">
                <button class="btn" onclick="refreshMirror()" style="background: #555; margin-top:0;">🔄 Refresh</button>
                <button class="btn" onclick="placeOrder()" style="background: #ff5722; margin-top:0;">🚀 Place Order (₹5)</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let telegramUserId = null;

        window.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram.WebApp;
            
            if (tg && (tg.initData || tg.platform || window.location.hash.includes('tgWebAppData'))) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                try { 
                    tg.expand(); 
                    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                        telegramUserId = tg.initDataUnsafe.user.id;
                        fetchUserAccounts(telegramUserId);
                    }
                } catch(e) {}
            } else {
                document.getElementById('lock-screen').style.display = 'flex';
                document.getElementById('main-content').style.display = 'none';
            }
        });

        function toggleJsonBox() {
            const box = document.getElementById('json-box');
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        // Fetch accounts from Firebase for this specific Telegram User
        async function fetchUserAccounts(userId) {
            const container = document.getElementById('accounts-container');
            try {
                const snapshot = await db.collection('accounts').where('user_id', '==', Number(userId)).get();
                if (snapshot.empty) {
                    container.innerHTML = '<p style="font-size: 13px; color: #888;">No accounts found. Add one using LOGIN JSON below.</p>';
                    return;
                }

                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    html += `
                        <div class="account-row">
                            <span style="font-size: 13px; font-weight: bold;">📱 ${data.account_name}</span>
                            <button class="switch-btn" onclick="switchAccount('${data.account_name}', '${data.auth_token}')">Switch</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="font-size: 13px; color: red;">Error loading accounts.</p>';
            }
        }

        async function loginWithJson() {
            const rawData = document.getElementById('json-input').value.trim();
            if (!rawData) {
                alert("❌ Kripya valid JSON ya token paste karein!");
                return;
            }

            try {
                let accName = "Acc_" + Math.floor(1000 + Math.random() * 9000);
                let authToken = rawData;

                if (rawData.startsWith("{")) {
                    const parsedData = JSON.parse(rawData);
                    accName = parsedData.account_name || accName;
                    authToken = parsedData.auth_token || rawData;
                }
                
                if (telegramUserId) {
                    await db.collection('accounts').add({
                        user_id: Number(telegramUserId),
                        account_name: accName,
                        auth_token: authToken
                    });
                }

                alert(`✅ Account (${accName}) successfully linked & saved to Bot & Mini Web!`);
                document.getElementById('json-input').value = "";
                document.getElementById('json-box').style.display = 'none';
                
                if (telegramUserId) fetchUserAccounts(telegramUserId);
            } catch (error) {
                console.error(error);
                alert("❌ Error saving account! Kripya sahi data dalein.");
            }
        }

        // Switch to selected account and open the Live Mirror view
        function switchAccount(accName, authToken) {
            localStorage.setItem('active_account', accName);
            localStorage.setItem('auth_token', authToken);

            document.getElementById('current-active-acc').innerText = `Connected: ${accName}`;
            document.getElementById('account-list-section').style.display = 'none';
            document.getElementById('json-box').style.display = 'none';
            document.querySelector('.json-toggle-btn').style.display = 'none';
            
            document.getElementById('order-screen-section').style.display = 'block';
            alert(`✅ Switched & Connected browser session to ${accName}!`);
        }

        function goBackToAccounts() {
            document.getElementById('order-screen-section').style.display = 'none';
            document.getElementById('account-list-section').style.display = 'block';
            document.querySelector('.json-toggle-btn').style.display = 'block';
        }

        function refreshMirror() {
            const iframe = document.getElementById('live-mirror-frame');
            iframe.src = iframe.src;
            alert("🔄 Backend page refreshed securely!");
        }

        function placeOrder() {
            if(confirm("Do you want to check wallet balance and place order for ₹5?")) {
                alert("🚀 Order execution request sent to backend bot successfully!");
            }
        }
    </script>

</body>
</html>
